        schema:
          type: string
          enum:
          - award
          - certification
          - milestone
          - other
          - partnership
          - recognition
        description: |-
          * `award` - Award
          * `certification` - Certification
          * `recognition` - Recognition
          * `milestone` - Milestone
          * `partnership` - Partnership
          * `other` - Other
