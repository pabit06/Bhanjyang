components:
  schemas:
    AccountTypeEnum:
      enum:
      - general
      - daily
      - institutional
      - child
      - senior_citizen
      - remit
      - insurance
      - monthly
      type: string
      description: |-
        * `general` - General Savings
        * `daily` - Daily Savings
        * `institutional` - Institutional Savings
        * `child` - Child Savings
        * `senior_citizen` - Senior Citizen Savings
        * `remit` - Remit Savings
        * `insurance` - Insurance Savings
        * `monthly` - Monthly Savings
    AchievementTypeEnum:
      enum:
      - award
      - certification
      - recognition
      - milestone
      - partnership
      - other
      type: string
      description: |-
        * `award` - Award
        * `certification` - Certification
        * `recognition` - Recognition
        * `milestone` - Milestone
        * `partnership` - Partnership
        * `other` - Other
    AffiliationTypeEnum:
      enum:
      - regulatory
      - association
      - partnership
      - certification
      - other
      type: string
      description: |-
        * `regulatory` - Regulatory Body
        * `association` - Professional Association
        * `partnership` - Partnership
        * `certification` - Certification Body
        * `other` - Other
    AlertLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alert:
          type: integer
        alert_type:
          type: string
          readOnly: true
        severity:
          type: string
          readOnly: true
        threshold:
          type: number
          format: double
          readOnly: true
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        current_value:
          type: number
          format: double
        message:
          type: string
        is_resolved:
          type: boolean
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - alert
      - alert_type
      - current_value
      - id
      - message
      - resolved_at
      - resolved_by
      - severity
      - threshold
      - triggered_at
    Committee:
      type: object
      description: Serializer for Committee model
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: e.g., सञ्चालक समिति, लेखा समिति
          maxLength: 150
        description:
          type: string
          title: Committee Description
        is_active:
          type: boolean
          description: Check this for the currently active committees.
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Display order (e.g., 1 for Board, 2 for Audit).
      required:
      - id
      - name
    CooperativeAchievement:
      type: object
      description: Serializer for CooperativeAchievement model
      properties:
        id:
