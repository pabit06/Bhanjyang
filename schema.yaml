          format: uri
          nullable: true
        is_active:
          type: boolean
          title: Active
        is_featured:
          type: boolean
          title: Featured Achievement
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Display Order
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - awarding_organization
      - created_at
      - description
      - id
      - received_date
      - title
      - updated_at
