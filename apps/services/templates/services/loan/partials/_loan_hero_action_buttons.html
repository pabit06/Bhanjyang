{% load i18n %}
{% comment %}
Action buttons for hero section
Usage: {% include 'services/loan/partials/_loan_hero_action_buttons.html' with service=service %}
{% endcomment %}

<!-- Quick Action Buttons -->
<div class="flex flex-wrap justify-center gap-4 animate-fade-in-up" style="animation-delay: 0.4s;">
    <a href="#calculator"
        class="px-8 py-4 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white font-bold rounded-xl border border-white/30 transition-all transform hover:-translate-y-1 flex items-center gap-2">
        <i class="fas fa-calculator"></i>{% trans "Calculate EMI" %}
    </a>
    <a href="{% url 'services:service_application' %}?service_type=loan&service_slug={{ service.slug }}"
        class="px-8 py-4 bg-white text-bhanjyangred font-bold rounded-xl shadow-lg hover:bg-gray-100 transition-all transform hover:-translate-y-1 flex items-center gap-2">
        <i class="fas fa-file-alt"></i>{% trans "Apply Now" %}
    </a>
</div>
