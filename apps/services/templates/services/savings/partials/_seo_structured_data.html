{% load static %}
{% load i18n %}
{% comment %}
Enhanced SEO Structured Data for Savings Accounts
Usage: {% include 'services/savings/partials/_seo_structured_data.html' with service=service %}
{% endcomment %}

<!-- Enhanced Structured Data (JSON-LD) for SEO -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "FinancialService",
    "name": "{% with account=service %}{% include 'services/savings/partials/_account_name_display.html' %}{% endwith %}",
    "alternateName": "{{ service.nepali_name }}",
    "description": "{{ service.description|striptags|truncatewords:50|default:'Savings account from Bhanjyang Cooperative with competitive interest rates' }}",
    "provider": {
        "@type": "CreditUnion",
        "name": "भञ्ज्याङ सहकारी",
        "alternateName": "Bhanjyang Saving & Credit Cooperative Society Ltd.",
        "url": "{{ request.scheme }}://{{ request.get_host }}/",
        "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/logos/Logo.png' %}",
        "address": {
            "@type": "PostalAddress",
            "addressCountry": "NP",
            "addressRegion": "Gandaki",
            "addressLocality": "Kaski"
        }
    },
    "serviceType": "SavingsAccount",
    "areaServed": {
        "@type": "Country",
        "name": "Nepal",
        "identifier": "NP"
    },
    "url": "{{ request.build_absolute_uri }}",
    "offers": {
        "@type": "Offer",
        "description": "{% if service.interest_rate %}Competitive interest rate up to {{ service.interest_rate }}% p.a.{% else %}Competitive interest rates{% endif %}",
        "priceCurrency": "NPR",
        "availability": "{% if service.is_active %}https://schema.org/InStock{% else %}https://schema.org/OutOfStock{% endif %}"
    },
    "image": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/logos/Logo.png' %}",
    "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150"
    }
}
</script>

<!-- BreadcrumbList Schema -->
{% if breadcrumbs %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "{% trans 'Home' %}",
            "item": "{{ request.scheme }}://{{ request.get_host }}/"
        },
        {
            "@type": "ListItem",
            "position": 2,
            "name": "{% trans 'Services' %}",
            "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'services:overview' %}"
        },
        {
            "@type": "ListItem",
            "position": 3,
            "name": "{% trans 'Savings Accounts' %}",
            "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'services:savings_list' %}"
        },
        {
            "@type": "ListItem",
            "position": 4,
            "name": "{% with account=service %}{% include 'services/savings/partials/_account_name_display.html' %}{% endwith %}",
            "item": "{{ request.build_absolute_uri }}"
        }
    ]
}
</script>
{% endif %}
