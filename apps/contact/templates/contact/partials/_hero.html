{% load i18n %}
<!-- Hero Section -->
<section class="relative bg-white text-deuraligreen overflow-hidden min-h-[60vh] md:min-h-[70vh] flex items-center" 
         style="opacity: 1 !important; visibility: visible !important;"
         aria-labelledby="contact-hero-heading">
    
    <!-- Background Image with Darkening Filter -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1544735716-392fe2489ffa?w=1920&h=1080&fit=crop"
            alt="{% trans 'Bhanjyang Cooperative Contact Page - Nepal Himalayas and Natural Landscape' %}"
            class="w-full h-full object-cover" 
            style="filter: brightness(0.5) contrast(1.1);"
            loading="eager" 
            fetchpriority="high" 
            decoding="async"
            width="1920"
            height="1080">

    </div>
    
    <!-- Decorative Elements with both colors -->
    <div class="absolute top-0 right-0 w-96 h-96 bg-deuraligreen/10 rounded-full translate-x-1/2 -translate-y-1/2 blur-3xl z-0" aria-hidden="true"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-bhanjyangred/10 rounded-full -translate-x-1/2 translate-y-1/2 blur-3xl z-0" aria-hidden="true"></div>
    <div class="absolute top-1/2 left-1/4 w-64 h-64 bg-deuraligreen/5 rounded-full -translate-x-1/2 -translate-y-1/2 blur-3xl z-0" aria-hidden="true"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-bhanjyangred/8 rounded-full translate-x-1/2 translate-y-1/2 blur-3xl z-0" aria-hidden="true"></div>
    
    <!-- Content -->
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center z-20 max-w-6xl w-full relative">
        <div data-aos="fade-up" data-aos-duration="800" class="flex flex-col items-center">
            <span class="inline-block text-white font-semibold uppercase text-sm mb-4 tracking-wider px-4 py-2 bg-bhanjyangred/30 backdrop-blur-sm rounded-full border border-white/40 shadow-lg"
                  style="text-shadow: 0 2px 6px rgba(0,0,0,0.9);"
                  role="text"
                  data-aos="fade-down"
                  data-aos-duration="600"
                  data-aos-delay="100">
                {% trans "Contact Us" %}
            </span>
            <h1 id="contact-hero-heading" class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold font-montserrat mb-6 sm:mb-8 text-white relative z-20 leading-tight"
                style="text-shadow: 
                    0 2px 4px rgba(0,0,0,0.9), 
                    0 4px 8px rgba(0,0,0,0.8), 
                    0 8px 16px rgba(0,0,0,0.7),
                    0 12px 24px rgba(0,0,0,0.6),
                    -1px -1px 0 rgba(0,0,0,0.5),
                    1px -1px 0 rgba(0,0,0,0.5),
                    -1px 1px 0 rgba(0,0,0,0.5),
                    1px 1px 0 rgba(0,0,0,0.5);
                opacity: 1 !important;"
                data-aos="fade-up"
                data-aos-duration="800"
                data-aos-delay="200">
                {% trans "Get In Touch" %}
            </h1>
            <div class="w-32 h-1 bg-bhanjyangred mx-auto rounded-full mb-6 shadow-lg" 
                 aria-hidden="true"
                 data-aos="fade-up"
                 data-aos-duration="600"
                 data-aos-delay="300"></div>
            <p class="text-lg sm:text-xl md:text-2xl max-w-3xl mx-auto leading-relaxed px-2 sm:px-4 text-white relative z-20 text-center block w-full"
                style="text-shadow: 
                    0 2px 4px rgba(0,0,0,0.95), 
                    0 4px 12px rgba(0,0,0,0.85),
                    0 6px 16px rgba(0,0,0,0.75),
                    -1px -1px 0 rgba(0,0,0,0.6),
                    1px -1px 0 rgba(0,0,0,0.6),
                    -1px 1px 0 rgba(0,0,0,0.6),
                    1px 1px 0 rgba(0,0,0,0.6);
                opacity: 1 !important;"
                data-aos="fade-up"
                data-aos-duration="800"
                data-aos-delay="400">
                {% trans "Whether you have a query, feedback, or need assistance, our dedicated team is ready to help." %}
            </p>
        </div>
    </div>
</section>
