{% load static %}
{% load i18n %}
<!-- Map Section -->
<section id="our-locations-map" class="relative py-12 bg-gradient-to-br from-white via-gray-50 to-white overflow-hidden" data-aos="fade-up" data-aos-duration="800">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-3">
        {% static 'images/backgrounds/pattern-light.png' as pattern_img %}
        <div class="absolute inset-0" style="background-image: url('{{ pattern_img }}'); background-repeat: repeat; background-size: 300px;"></div>
    </div>
    
    <!-- Decorative Elements -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-deuraligreen/5 rounded-full -translate-x-1/2 -translate-y-1/2 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-bhanjyangred/5 rounded-full translate-x-1/2 translate-y-1/2 blur-3xl"></div>
    
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="text-center mb-12">
            <span class="inline-block text-deuraligreen font-semibold uppercase text-sm mb-4 tracking-wider px-4 py-2 bg-deuraligreen/10 rounded-full">
                स्थानहरू
            </span>
            <h2 class="text-3xl sm:text-4xl font-bold font-montserrat mb-4 text-gray-900">
                नक्सामा हाम्रो स्थान हेर्नुहोस्
            </h2>
            <div class="w-24 h-1 bg-deuraligreen mx-auto rounded-full mb-6"></div>
            <p class="text-lg text-gray-600 max-w-3xl mx-auto leading-relaxed">
                हाम्रो मुख्य कार्यालय (रूपा-५) वा सेवा केन्द्र (रूपा-३) को नक्सा हेर्न तलका बटनहरू प्रयोग गर्नुहोस्।
            </p>
        </div>

        <div class="relative rounded-2xl shadow-2xl overflow-hidden border-4 border-deuraligreen">
            <div id="map-loading"
                class="absolute inset-0 bg-gray-100/75 backdrop-blur-sm flex items-center justify-center z-10 hidden">
                <div class="flex flex-col items-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-deuraligreen mb-2"></div>
                    <p class="text-sm font-poppins text-gray-600">Loading map...</p>
                </div>
            </div>

            <iframe id="location-map-iframe"
                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d7037.612645021445!2d84.149533!3d28.121932!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995a3aea5af600d%3A0xacb415d2023a9c80!2sBhanjyang%20Saving%20%26%20Credit%20Cooperative%20Society%20Ltd.!5e0!3m2!1sen!2snp!4v1760763305577!5m2!1sen!2snp"
                title="Interactive map showing Bhanjyang Cooperative Main Office and Service Center locations. Use the toggle buttons below to switch between locations."
                class="w-full h-64 sm:h-72 md:h-80 lg:h-[450px] transition-opacity duration-300 ease-in-out"
                style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                aria-label="Interactive map of Bhanjyang Cooperative locations">
            </iframe>
        </div>

        <!-- Enhanced Modern Toggle Switch for Map Locations -->
        <div class="flex flex-col items-center justify-center mt-10 mb-4">
            <!-- Toggle Container with Glass Effect -->
            <div class="relative inline-flex items-center bg-gradient-to-r from-gray-100 to-gray-50 rounded-2xl p-1 shadow-2xl border border-gray-200/50 backdrop-blur-sm">
                <!-- Animated Background Glow -->
                <div class="absolute inset-0 rounded-2xl bg-gradient-to-r from-deuraligreen/10 to-bhanjyangred/10 blur-xl opacity-50"></div>
                
                <!-- Toggle Buttons Container -->
                <div class="relative flex items-center gap-1">
                    <!-- Main Office Option -->
                    <button id="map-toggle-main"
                        data-map-src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d7037.612645021445!2d84.149533!3d28.121932!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995a3aea5af600d%3A0xacb415d2023a9c80!2sBhanjyang%20Saving%20%26%20Credit%20Cooperative%20Society%20Ltd.!5e0!3m2!1sen!2snp!4v1760763305577!5m2!1sen!2snp"
                        class="map-toggle-btn relative z-10 flex items-center gap-3 px-6 py-3.5 rounded-xl text-sm font-bold font-poppins transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] text-white bg-gradient-to-r from-deuraligreen to-emerald-600 shadow-lg shadow-deuraligreen/30"
                        data-location="main"
                        role="tab"
                        aria-selected="true"
                        tabindex="0">
                        <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
                            <i class="fas fa-building text-base"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-xs opacity-80 font-medium">मुख्य कार्यालय</span>
                            <span class="block">मुख्य कार्यालय</span>
                        </div>
                    </button>

                    <!-- Service Center Option -->
                    <button id="map-toggle-service"
                        data-map-src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d14886.364800504987!2d84.20693577278259!3d28.108180724514312!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995a1bd584f5877%3A0x8c71bcb5b99757ed!2sBhanjyang%20Saving%20%26%20Credit%20Cooperative%20Society%20Ltd.%20Polyang%20Branch!5e0!3m2!1sen!2snp!4v1760763359401!5m2!1sen!2snp"
                        class="map-toggle-btn relative z-10 flex items-center gap-3 px-6 py-3.5 rounded-xl text-sm font-bold font-poppins transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] text-gray-600 bg-transparent hover:bg-gray-100/50"
                        data-location="service"
                        role="tab"
                        aria-selected="false"
                        tabindex="0">
                        <div class="w-8 h-8 rounded-lg bg-gray-200/50 flex items-center justify-center">
                            <i class="fas fa-map-marker-alt text-base"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-xs opacity-60 font-medium">सेवा केन्द्र</span>
                            <span class="block">सेवा केन्द्र</span>
                        </div>
                    </button>
                    </div>
                </div>
            
            <!-- Location Label -->
            <div id="current-location-label" class="mt-4 flex items-center gap-2 text-sm text-gray-600 font-medium">
                <i class="fas fa-map-pin text-deuraligreen"></i>
                <span>Rupa-5, Deurali, Kaski</span>
            </div>
        </div>
    </div>
</section>
