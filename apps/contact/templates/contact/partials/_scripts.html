<script>
    // Initialize AOS Animation Library
    document.addEventListener('DOMContentLoaded', function() {
        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        if (typeof AOS !== 'undefined') {
            try {
                AOS.init({
                    once: true,
                    offset: 100,
                    duration: prefersReducedMotion ? 0 : 800,
                    easing: 'ease-out-cubic',
                    delay: 0,
                    disable: prefersReducedMotion ? 'mobile' : false
                });
            } catch (error) {
                console.warn('AOS initialization failed:', error);
            }
        }
    });
</script>
<script>


    // Global toast functions (fallback if not defined elsewhere)
    if (typeof showSuccess === 'undefined') {
        function showSuccess(message, title = 'Success') {
            if (typeof Toast !== 'undefined' && Toast.success) {
                Toast.success(title ? `${title}: ${message}` : message);
            } else {
                console.log('Success:', title, message);
            }
        }
    }

    if (typeof showError === 'undefined') {
        function showError(message, title = 'Error') {
            if (typeof Toast !== 'undefined' && Toast.error) {
                Toast.error(title ? `${title}: ${message}` : message);
            } else {
                console.error('Error:', title, message);
            }
        }
    }

    // Constants
    const VALIDATION_DEBOUNCE_DELAY = 300;
    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB in bytes
    const ALLOWED_FILE_EXTENSIONS = ['.pdf', '.doc', '.docx', '.jpg', '.png'];
    const ALLOWED_MIME_TYPES = [
        'application/pdf',
        'application/msword',
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        'image/jpeg',
        'image/png'
    ];
    const MAP_LOAD_TIMEOUT = 5000; // 5 seconds

    // Debounce utility function
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // reCAPTCHA configuration
    const RECAPTCHA_SITE_KEY = '{{ form.recaptcha_site_key|default:"" }}';
    const RECAPTCHA_ENABLED = {{ form.recaptcha_enabled|yesno:"true,false" }};
    let recaptchaWidgetId = null;
    let recaptchaReady = false; // Track if reCAPTCHA is loaded and ready

    // Function to initialize reCAPTCHA widget
    function initializeRecaptcha() {
        if (typeof grecaptcha === 'undefined') {
            return;
        }
        
        const recaptchaContainer = document.getElementById('recaptcha-container');
        if (!recaptchaContainer) {
            return;
        }
        
        // Use grecaptcha.ready() to ensure API is fully loaded
        if (typeof grecaptcha.ready === 'function') {
            grecaptcha.ready(function() {
                try {
                    recaptchaWidgetId = grecaptcha.render('recaptcha-container', {
                        'sitekey': RECAPTCHA_SITE_KEY,
                        'theme': 'light',
                        'size': 'normal',
                        'callback': function(token) {
                            // Token is automatically populated in the hidden field
                            recaptchaReady = true;
                        },
                        'expired-callback': function() {
                            // Token expired, user needs to solve again
                            recaptchaReady = false;
                        }
                    });
                    recaptchaReady = true; // Mark reCAPTCHA as ready
                } catch (error) {
                    console.error('Error rendering reCAPTCHA widget:', error);
                }
            });
        } else {
            // Fallback for older reCAPTCHA API versions
            try {
                recaptchaWidgetId = grecaptcha.render('recaptcha-container', {
                    'sitekey': RECAPTCHA_SITE_KEY,
                    'theme': 'light',
                    'size': 'normal'
                });
                recaptchaReady = true;
            } catch (error) {
                console.error('Error rendering reCAPTCHA widget:', error);
            }
        }
    }

    // Load reCAPTCHA script if enabled
    if (RECAPTCHA_ENABLED && RECAPTCHA_SITE_KEY) {
        const script = document.createElement('script');
        script.src = 'https://www.google.com/recaptcha/api.js?render=explicit';
        script.async = true;
        script.defer = true;
        script.onload = function() {
            // Wait for DOM to be ready before initializing
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeRecaptcha);
            } else {
                // DOM is already ready
                initializeRecaptcha();
            }
        };
        script.onerror = function() {
            console.error('Failed to load reCAPTCHA script');
            // If reCAPTCHA fails to load, we should still prevent submission
            // to maintain security
        };
        document.head.appendChild(script);
    } else {
        // If reCAPTCHA is not enabled, mark as ready (no validation needed)
        recaptchaReady = true;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('contactForm');
        const submitButton = document.getElementById('submitButton');
        const buttonText = document.getElementById('buttonText');
        const buttonIcon = document.getElementById('buttonIcon');
        const loadingIcon = document.getElementById('loadingIcon');
        const formMessages = document.getElementById('form-messages');
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');
        const validationErrors = document.getElementById('validation-errors');
        const validationList = document.getElementById('validation-list');
        const errorDetails = document.getElementById('error-details');

        if (!form) return;

        // Real-time validation with debouncing
        const formFields = form.querySelectorAll('input, textarea, select');
        
        // Form auto-save functionality
        const FORM_STORAGE_KEY = 'contact_form_draft';
        const AUTO_SAVE_DELAY = 1000; // Save after 1 second of inactivity
        
        // Restore saved form data
        function restoreFormData() {
            try {
                const savedData = localStorage.getItem(FORM_STORAGE_KEY);
                if (savedData) {
                    const data = JSON.parse(savedData);
                    formFields.forEach(field => {
                        if (field.type !== 'file' && data[field.name] !== undefined) {
                            field.value = data[field.name];
                            // Trigger input event to update UI
                            field.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    });
                    // Show restore notification
                    const restoreNotification = document.createElement('div');
                    restoreNotification.className = 'bg-blue-50 border border-blue-200 text-blue-800 px-4 py-2 rounded-lg mb-4 flex items-center justify-between';
                    restoreNotification.innerHTML = `
                        <span class="flex items-center gap-2">
                            <i class="fas fa-info-circle"></i>
                            <span>Draft restored. <button id="clear-draft" class="underline font-semibold">Clear</button></span>
                        </span>
                    `;
                    formMessages.insertBefore(restoreNotification, formMessages.firstChild);
                    
                    // Clear draft button
                    document.getElementById('clear-draft')?.addEventListener('click', () => {
                        clearFormDraft();
                        restoreNotification.remove();
                    });
                    
                    // Auto-hide after 5 seconds
                    setTimeout(() => {
                        if (restoreNotification.parentNode) {
                            restoreNotification.remove();
                        }
                    }, 5000);
                }
            } catch (error) {
                console.error('Error restoring form data:', error);
            }
        }
        
        // Save form data to localStorage
        function saveFormData() {
            try {
                const formData = {};
                formFields.forEach(field => {
                    if (field.type !== 'file' && field.name) {
                        formData[field.name] = field.value;
                    }
                });
                localStorage.setItem(FORM_STORAGE_KEY, JSON.stringify(formData));
            } catch (error) {
                console.error('Error saving form data:', error);
            }
        }
        
        // Clear form draft
        function clearFormDraft() {
            localStorage.removeItem(FORM_STORAGE_KEY);
        }
        
        // Debounced auto-save
        const debouncedSave = debounce(saveFormData, AUTO_SAVE_DELAY);
        
        // Auto-save on input
        formFields.forEach(field => {
            if (field.type !== 'file') {
                field.addEventListener('input', () => {
                    debouncedSave();
                });
                field.addEventListener('change', () => {
                    debouncedSave();
                });
            }
        });
        
        // Restore on page load
        restoreFormData();

        // Set up aria-describedby for all form fields
        formFields.forEach(field => {
            const errorId = field.id + '_error';
            const helpId = field.id + '_help';
            const errorElement = document.getElementById(errorId);
            const helpElement = document.getElementById(helpId);

            let describedBy = [];
            if (helpElement) describedBy.push(helpId);
            if (errorElement) describedBy.push(errorId);

            if (describedBy.length > 0) {
                field.setAttribute('aria-describedby', describedBy.join(' '));
            }

            // Set aria-required for required fields
            if (field.required) {
                field.setAttribute('aria-required', 'true');
            }
        });
        const debouncedValidate = debounce(function (field) {
            validateField(field);
        }, VALIDATION_DEBOUNCE_DELAY);

        formFields.forEach(field => {
            field.addEventListener('blur', function () {
                validateField(this);
            });

            field.addEventListener('input', function () {
                clearFieldError(this);
                // Debounced validation for real-time feedback
                if (this.type !== 'file') {
                    debouncedValidate(this);
                }
            });

            // Special handling for file input
            if (field.type === 'file') {
                field.addEventListener('change', function () {
                    try {
                        validateFileField(this);
                    } catch (error) {
                        console.error('File validation error:', error);
                        showFieldError(this, 'An error occurred while validating the file. Please try again.');
                    }
                });
            }

            // Character counter for message field
            if (field.name === 'message') {
                const charCountElement = document.getElementById(field.id + '_char_count');
                if (charCountElement) {
                    field.addEventListener('input', function () {
                        const length = this.value.length;
                        const minLength = 10;
                        charCountElement.textContent = `${length} अक्षहरू${length < minLength ? ` (कम्तिमा ${minLength})` : ''}`;
                        if (length < minLength) {
                            charCountElement.classList.add('text-yellow-600');
                            charCountElement.classList.remove('text-gray-500');
                        } else {
                            charCountElement.classList.remove('text-yellow-600');
                            charCountElement.classList.add('text-gray-500');
                        }
                    });
                }
            }
        });

        function validateField(field) {
            const value = field.value.trim();
            const fieldName = field.name;
            clearFieldError(field);

            // Required field validation
            if (field.required && !value) {
                showFieldError(field, `${getFieldLabel(fieldName)} अनिवार्य छ।`);
                return false;
            }

            // Specific field validations
            switch (fieldName) {
                case 'name':
                    if (value && value.length < 2) {
                        showFieldError(field, 'नाम कम्तिमा २ अक्षरको हुनुपर्छ।');
                        return false;
                    }
                    if (value && !/^[a-zA-Z\s\-'\.]+$/.test(value)) {
                        showFieldError(field, 'नाममा अक्षर, स्पेस, हाइफन र थोप्लो मात्र प्रयोग गर्न पाइन्छ।');
                        return false;
                    }
                    break;
                case 'email':
                    if (value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                        showFieldError(field, 'कृपया मान्य इमेल ठेगाना प्रविष्ट गर्नुहोस्।');
                        return false;
                    }
                    break;
                case 'phone':
                    if (value) {
                        const cleanedPhone = value.replace(/[^\d+]/g, '');
                        if (cleanedPhone.length < 7 || cleanedPhone.length > 15) {
                            showFieldError(field, 'कृपया मान्य फोन नम्बर प्रविष्ट गर्नुहोस्।');
                            return false;
                        }
                    }
                    break;
                case 'message':
                    if (value && value.length < 10) {
                        showFieldError(field, 'सन्देश कम्तिमा १० अक्षरको हुनुपर्छ।');
                        return false;
                    }
                    break;
            }
            return true;
        }

        function validateFileField(field) {
            try {
                const file = field.files[0];
                if (file) {
                    clearFieldError(field);
                    // Check file size (5MB limit)
                    if (file.size > MAX_FILE_SIZE) {
                        showFieldError(field, 'फाइल साइज ५MB भन्दा बढी हुन सक्दैन।');
                        return false;
                    }

                    // Check file extension (matching server-side validation)
                    const fileExtension = '.' + file.name.toLowerCase().split('.').pop();
                    if (!ALLOWED_FILE_EXTENSIONS.includes(fileExtension)) {
                        showFieldError(field, 'कृपया मान्य फाइल प्रकार (PDF, DOC, DOCX, JPG, PNG मात्र) अपलोड गर्नुहोस्।');
                        return false;
                    }

                    // Check MIME type (additional validation)
                    if (file.type && !ALLOWED_MIME_TYPES.includes(file.type)) {
                        showFieldError(field, 'कृपया मान्य फाइल प्रकार (PDF, DOC, DOCX, JPG, PNG मात्र) अपलोड गर्नुहोस्।');
                        return false;
                    }
                }
                return true;
            } catch (error) {
                console.error('File validation error:', error);
                showFieldError(field, 'फाइल मान्यकरण गर्दा त्रुटि भयो। कृपया पुनः प्रयास गर्नुहोस्।');
                return false;
            }
        }

        function showFieldError(field, message) {
            const errorElement = field.parentElement.querySelector('.error-message') ||
                document.getElementById(field.id + '_error');
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
                field.classList.add('border-red-500', 'focus:ring-red-500');
                field.classList.remove('border-gray-300', 'focus:ring-deuraligreen');
                // Ensure aria-describedby includes error element
                const describedBy = field.getAttribute('aria-describedby') || '';
                if (!describedBy.includes(errorElement.id)) {
                    field.setAttribute('aria-describedby',
                        (describedBy ? describedBy + ' ' : '') + errorElement.id);
                }
                field.setAttribute('aria-invalid', 'true');
            }
        }

        function clearFieldError(field) {
            const errorElement = field.parentElement.querySelector('.error-message') ||
                document.getElementById(field.id + '_error');
            if (errorElement) {
                errorElement.classList.add('hidden');
                errorElement.textContent = '';
                field.classList.remove('border-red-500', 'focus:ring-red-500');
                field.classList.add('border-gray-300', 'focus:ring-deuraligreen');
                field.setAttribute('aria-invalid', 'false');
            }
        }

        function getFieldLabel(fieldName) {
            const labels = {
                'name': 'नाम',
                'email': 'इमेल',
                'phone': 'फोन',
                'subject': 'विषय',
                'message': 'सन्देश'
            };
            return labels[fieldName] || fieldName;
        }

        function hideAllMessages() {
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');
            if (validationErrors) {
                validationErrors.classList.add('hidden');
            }
        }

        function showSuccessMessage() {
            hideAllMessages();
            successMessage.classList.remove('hidden');
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Also show sticky notice
            showSuccess("धन्यवाद! तपाईंको सन्देश सफलतापूर्वक पठाइयो।", "सन्देश पठाइयो");
        }

        function showErrorMessage(message) {
            hideAllMessages();
            if (errorDetails) {
                errorDetails.textContent = message;
            } else {
                console.error('errorDetails element not found');
            }
            if (errorMessage) {
                errorMessage.classList.remove('hidden');
            }
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Also show sticky notice
            showError(message, "त्रुटि");
        }

        function showValidationErrors(errors) {
            hideAllMessages();
            if (validationList) {
                validationList.innerHTML = '';
            } else {
                console.error('validationList element not found');
            }

            Object.keys(errors).forEach(field => {
                errors[field].forEach(error => {
                    const li = document.createElement('li');
                    li.textContent = `${getFieldLabel(field)}: ${error}`;
                    if (validationList) {
                        validationList.appendChild(li);
                    }
                });
                // Also show field-level errors
                const fieldElement = form.querySelector(`[name="${field}"]`);
                if (fieldElement && errors[field].length > 0) {
                    showFieldError(fieldElement, errors[field][0]);
                }
            });

            if (validationErrors) {
                validationErrors.classList.remove('hidden');
            } else {
                console.error('validationErrors element not found');
            }
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function setLoadingState(loading) {
            if (loading) {
                submitButton.disabled = true;
                buttonText.textContent = 'पठाउँदै...';
                buttonIcon.style.display = 'none';
                loadingIcon.style.display = 'inline-block';
                submitButton.classList.add('opacity-75');
            } else {
                submitButton.disabled = false;
                buttonText.textContent = 'सन्देश पठाउनुहोस्';
                buttonIcon.style.display = 'inline-block';
                loadingIcon.style.display = 'none';
                submitButton.classList.remove('opacity-75');
            }
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            try {
                // Validate all fields
                let isValid = true;
                const errors = {};

                formFields.forEach(field => {
                    let fieldValid = true;
                    try {
                        if (field.type === 'file') {
                            fieldValid = validateFileField(field);
                        } else {
                            fieldValid = validateField(field);
                        }
                    } catch (error) {
                        console.error('Validation error for field:', field.name, error);
                        fieldValid = false;
                    }

                    if (!fieldValid) {
                        isValid = false;
                        const fieldName = field.name;
                        if (!errors[fieldName]) {
                            errors[fieldName] = [];
                        }
                        const errorElement = field.parentElement.querySelector('.error-message') ||
                            document.getElementById(field.id + '_error');
                        if (errorElement && !errorElement.classList.contains('hidden') && errorElement.textContent) {
                            errors[fieldName].push(errorElement.textContent);
                        }
                    }
                });

                if (!isValid) {
                    showValidationErrors(errors);
                    return;
                }

                setLoadingState(true);
                hideAllMessages();

                // Validate reCAPTCHA before proceeding
                if (RECAPTCHA_ENABLED && RECAPTCHA_SITE_KEY) {
                    // Check if reCAPTCHA is ready (loaded and rendered)
                    if (!recaptchaReady || recaptchaWidgetId === null) {
                        setLoadingState(false);
                        showErrorMessage('कृपया reCAPTCHA लोड हुन प्रतिक्षा गर्नुहोस्। कृपया पृष्ठ पुनः लोड गर्नुहोस्।');
                        return;
                    }
                    
                    // Get reCAPTCHA token
                    if (typeof grecaptcha === 'undefined') {
                        setLoadingState(false);
                        showErrorMessage('reCAPTCHA लोड भएन। कृपया पृष्ठ पुनः लोड गर्नुहोस्।');
                        return;
                    }
                    
                    const recaptchaToken = grecaptcha.getResponse(recaptchaWidgetId);
                    if (!recaptchaToken) {
                        setLoadingState(false);
                        const recaptchaContainer = document.getElementById('recaptcha-container');
                        if (recaptchaContainer) {
                            const recaptchaError = recaptchaContainer.nextElementSibling;
                            if (recaptchaError && recaptchaError.classList.contains('error-message')) {
                                recaptchaError.textContent = 'कृपया reCAPTCHA प्रमाणित गर्नुहोस्।';
                                recaptchaError.classList.remove('hidden');
                            }
                        }
                        showErrorMessage('कृपया reCAPTCHA प्रमाणित गर्नुहोस्।');
                        return;
                    }
                }

                const formData = new FormData(form);
                const csrftoken = form.querySelector('[name=csrfmiddlewaretoken]').value;

                // Add reCAPTCHA token to form data if enabled
                if (RECAPTCHA_ENABLED && RECAPTCHA_SITE_KEY && recaptchaWidgetId !== null) {
                    const recaptchaToken = grecaptcha.getResponse(recaptchaWidgetId);
                    const recaptchaField = form.querySelector('[name="recaptcha_token"]');
                    if (recaptchaField) {
                        recaptchaField.value = recaptchaToken;
                    } else {
                        formData.append('recaptcha_token', recaptchaToken);
                    }
                }

                fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken,
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        // Check if response is JSON
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            return response.json();
                        } else {
                            return response.text().then(text => {
                                throw new Error('Server returned non-JSON response');
                            });
                        }
                    })
                    .then(data => {
                        if (data.success) {
                            showSuccessMessage();
                            // Clear form draft on successful submission
                            clearFormDraft();
                            // Explicitly clear file inputs
                            formFields.forEach(field => {
                                if (field.type === 'file') {
                                    field.value = '';
                                }
                                clearFieldError(field);
                            });
                            form.reset();
                            // Clear character counter
                            const messageField = form.querySelector('[name="message"]');
                            if (messageField) {
                                const charCount = document.getElementById(messageField.id + '_char_count');
                                if (charCount) {
                                    charCount.textContent = '';
                                }
                            }
                        } else {
                            if (data.errors) {
                                showValidationErrors(data.errors);
                            } else {
                                showErrorMessage(data.message || 'An error occurred while sending your message.');
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Form submission error:', error);
                        showErrorMessage('नेटवर्क त्रुटि। कृपया आफ्नो जडान जाँच गर्नुहोस् र पुनः प्रयास गर्नुहोस्।');
                    })
                    .finally(() => {
                        setLoadingState(false);
                    });
            } catch (error) {
                console.error('Form submission error:', error);
                setLoadingState(false);
                showErrorMessage('एक अप्रत्याशित त्रुटि भयो। कृपया पुनः प्रयास गर्नुहोस्।');
            }
        });

        // Track form changes for beforeunload warning
        let formHasData = false;
        formFields.forEach(field => {
            field.addEventListener('input', function () {
                formHasData = true;
            });
        });

        window.addEventListener('beforeunload', function (e) {
            if (formHasData) {
                e.preventDefault();
                e.returnValue = 'तपाईंसँग सुरक्षित नगरिएका परिवर्तनहरू छन्। के तपाईं जान निश्चित हुनुहुन्छ?';
                return e.returnValue;
            }
        });

        // Reset formHasData flag after successful submission
        const originalShowSuccessMessage = showSuccessMessage;
        showSuccessMessage = function () {
            formHasData = false;
            originalShowSuccessMessage();
        };
    });

    // Enhanced Toggle Switch functionality for Map Locations
    document.addEventListener('DOMContentLoaded', function () {
        const mapToggleMain = document.getElementById('map-toggle-main');
        const mapToggleService = document.getElementById('map-toggle-service');
        const mapIframe = document.getElementById('location-map-iframe');
        const mapLoading = document.getElementById('map-loading');
        const locationLabel = document.getElementById('current-location-label');

        if (!mapToggleMain || !mapToggleService || !mapIframe) return;

        let currentLocation = 'main'; // Track current location

        // Map sources and labels
        const locations = {
            main: {
                src: 'https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d7037.612645021445!2d84.149533!3d28.121932!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995a3aea5af600d%3A0xacb415d2023a9c80!2sBhanjyang%20Saving%20%26%20Credit%20Cooperative%20Society%20Ltd.!5e0!3m2!1sen!2snp!4v1760763305577!5m2!1sen!2snp',
                label: 'रूपा-५, देउराली, कास्की',
                color: 'deuraligreen'
            },
            service: {
                src: 'https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d14886.364800504987!2d84.20693577278259!3d28.108180724514312!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995a1bd584f5877%3A0x8c71bcb5b99757ed!2sBhanjyang%20Saving%20%26%20Credit%20Cooperative%20Society%20Ltd.%20Polyang%20Branch!5e0!3m2!1sen!2snp!4v1760763359401!5m2!1sen!2snp',
                label: 'रूपा-३, पोल्याङ्ग, कास्की',
                color: 'bhanjyangred'
            }
        };

        // Active button styles
        const activeClasses = 'text-white bg-gradient-to-r shadow-lg';
        const mainActiveClasses = 'from-deuraligreen to-emerald-600 shadow-deuraligreen/30';
        const serviceActiveClasses = 'from-bhanjyangred to-red-600 shadow-bhanjyangred/30';
        const inactiveClasses = 'text-gray-600 bg-transparent hover:bg-gray-100/50';

        function updateToggleState(location) {
            currentLocation = location;
            const isMain = location === 'main';

            // Update Main Office button
            if (isMain) {
                mapToggleMain.className = `map-toggle-btn relative z-10 flex items-center gap-3 px-6 py-3.5 rounded-xl text-sm font-bold font-poppins transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] ${activeClasses} ${mainActiveClasses}`;
                mapToggleMain.querySelector('.w-8').className = 'w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center';
                mapToggleMain.setAttribute('aria-selected', 'true');
            } else {
                mapToggleMain.className = `map-toggle-btn relative z-10 flex items-center gap-3 px-6 py-3.5 rounded-xl text-sm font-bold font-poppins transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] ${inactiveClasses}`;
                mapToggleMain.querySelector('.w-8').className = 'w-8 h-8 rounded-lg bg-gray-200/50 flex items-center justify-center';
                mapToggleMain.setAttribute('aria-selected', 'false');
            }

            // Update Service Center button
            if (!isMain) {
                mapToggleService.className = `map-toggle-btn relative z-10 flex items-center gap-3 px-6 py-3.5 rounded-xl text-sm font-bold font-poppins transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] ${activeClasses} ${serviceActiveClasses}`;
                mapToggleService.querySelector('.w-8').className = 'w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center';
                mapToggleService.setAttribute('aria-selected', 'true');
            } else {
                mapToggleService.className = `map-toggle-btn relative z-10 flex items-center gap-3 px-6 py-3.5 rounded-xl text-sm font-bold font-poppins transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] ${inactiveClasses}`;
                mapToggleService.querySelector('.w-8').className = 'w-8 h-8 rounded-lg bg-gray-200/50 flex items-center justify-center';
                mapToggleService.setAttribute('aria-selected', 'false');
            }

            // Update location label
            if (locationLabel) {
                const loc = locations[location];
                locationLabel.innerHTML = `<i class="fas fa-map-pin text-${loc.color}"></i><span>${loc.label}</span>`;
            }
        }

        function switchMap(location) {
            if (!mapIframe || currentLocation === location) return;

            const locationData = locations[location];
            if (locationData && locationData.src !== mapIframe.src) {
                const newSrc = locationData.src;
                // Show loading spinner
                if (mapLoading) {
                    mapLoading.classList.remove('hidden');
                    mapIframe.style.opacity = '0.3';
                }

                // Update toggle state
                updateToggleState(location);

                // Change map source
                mapIframe.src = newSrc;

                // Use iframe load event instead of fixed timeout
                const handleMapLoad = function () {
                    if (mapLoading) {
                        mapLoading.classList.add('hidden');
                        mapIframe.style.opacity = '1';
                    }
                    mapIframe.removeEventListener('load', handleMapLoad);
                };

                mapIframe.addEventListener('load', handleMapLoad);

                // Fallback timeout in case load event doesn't fire
                setTimeout(() => {
                    if (mapLoading && !mapLoading.classList.contains('hidden')) {
                        mapLoading.classList.add('hidden');
                        mapIframe.style.opacity = '1';
                    }
                }, MAP_LOAD_TIMEOUT);
            }
        }

        // Event listeners for toggle buttons with keyboard support
        if (mapToggleMain) {
            mapToggleMain.setAttribute('role', 'button');
            mapToggleMain.setAttribute('aria-pressed', 'true');
            mapToggleMain.setAttribute('tabindex', '0');
            mapToggleMain.addEventListener('click', function () {
                switchMap('main');
            });
            mapToggleMain.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    switchMap('main');
                }
            });
        }

        if (mapToggleService) {
            mapToggleService.setAttribute('role', 'button');
            mapToggleService.setAttribute('aria-pressed', 'false');
            mapToggleService.setAttribute('tabindex', '0');
            mapToggleService.addEventListener('click', function () {
                switchMap('service');
            });
            mapToggleService.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    switchMap('service');
                }
            });
        }

        // Initialize with Main Office selected
        // Use setTimeout to ensure DOM is fully rendered before calculating widths
        setTimeout(() => {
            updateToggleState('main');
        }, 100);
    });
</script>
