<div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 border-t-4 border-{{ color }} animated-element animate-in-up delay-{{ delay }}">
    <i class="fas {{ icon }} text-5xl text-{{ color }} mb-4"></i>
    <h3 class="text-xl font-semibold text-gray-900 mb-3 font-montserrat">{{ title }}</h3>
    <div class="text-gray-700 leading-relaxed">
        {{ content|safe }}
    </div>
    {% if link_url %}
        <a href="{{ link_url }}" target="_blank" rel="noopener noreferrer" class="block mt-4 text-{{ color }} hover:underline font-semibold">
            {{ link_text }} <i class="fas fa-external-link-alt ml-1 text-xs"></i>
        </a>
    {% endif %}
    {% if footer_text %}
        <p class="text-sm text-gray-600 mt-2">{{ footer_text }}</p>
    {% endif %}
</div>
