<!-- Card Component -->
<div class="bg-white rounded-lg shadow-soft border border-gray-200 {% if hover %}hover:shadow-medium transition-shadow duration-300{% endif %} {% if class %}{{ class }}{% endif %}">
    {% if header %}
    <div class="px-6 py-4 border-b border-gray-200">
        <div class="flex items-center justify-between">
            <h3 class="text-lg font-semibold text-gray-900">{{ header }}</h3>
            {% if header_action %}
            <div class="flex items-center space-x-2">
                {{ header_action }}
            </div>
            {% endif %}
        </div>
        {% if subtitle %}
        <p class="mt-1 text-sm text-gray-500">{{ subtitle }}</p>
        {% endif %}
    </div>
    {% endif %}
    
    <div class="{% if header %}px-6 py-4{% else %}p-6{% endif %}">
        {{ content }}
    </div>
    
    {% if footer %}
    <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
        {{ footer }}
    </div>
    {% endif %}
</div>
