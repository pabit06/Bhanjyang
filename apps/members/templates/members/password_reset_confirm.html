<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Bhanjyang Cooperative</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: #6b7280;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .password-strength {
            margin-top: 10px;
        }
        
        .strength-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak .strength-fill {
            background: #ef4444;
            width: 25%;
        }
        
        .strength-fair .strength-fill {
            background: #f59e0b;
            width: 50%;
        }
        
        .strength-good .strength-fill {
            background: #10b981;
            width: 75%;
        }
        
        .strength-strong .strength-fill {
            background: #059669;
            width: 100%;
        }
        
        .strength-text {
            font-size: 12px;
            font-weight: 500;
        }
        
        .requirements {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: #6b7280;
        }
        
        .requirements h4 {
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .requirements ul {
            margin-left: 15px;
        }
        
        .requirements li {
            margin-bottom: 3px;
        }
        
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .links a:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <h1>Bhanjyang Cooperative</h1>
            <p>Set Your New Password</p>
        </div>
        
        <form method="post" id="resetForm">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_new_password1">New Password</label>
                <input type="password" id="id_new_password1" name="new_password1" required>
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill"></div>
                    </div>
                    <div class="strength-text">Enter a password</div>
                </div>
                <div class="requirements">
                    <h4>Password Requirements:</h4>
                    <ul>
                        <li>At least 8 characters long</li>
                        <li>Contains uppercase and lowercase letters</li>
                        <li>Contains at least one number</li>
                        <li>Contains at least one special character</li>
                    </ul>
                </div>
            </div>
            
            <div class="form-group">
                <label for="id_new_password2">Confirm New Password</label>
                <input type="password" id="id_new_password2" name="new_password2" required>
            </div>
            
            <button type="submit" class="btn">Reset Password</button>
            
            <div class="links">
                <a href="#" onclick="history.back()">← Back to Login</a>
            </div>
        </form>
    </div>
    
    <script>
        // Password strength checker
        const passwordInput = document.getElementById('id_new_password1');
        const strengthBar = document.querySelector('.strength-bar');
        const strengthFill = document.querySelector('.strength-fill');
        const strengthText = document.querySelector('.strength-text');
        
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = checkPasswordStrength(password);
            
            // Remove all strength classes
            strengthBar.className = 'strength-bar';
            strengthFill.className = 'strength-fill';
            
            // Add appropriate strength class
            if (strength.score > 0) {
                strengthBar.classList.add(strength.class);
            }
            
            strengthText.textContent = strength.text;
        });
        
        function checkPasswordStrength(password) {
            let score = 0;
            
            if (password.length >= 8) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            
            const strengthLevels = [
                { class: 'strength-weak', text: 'Weak password' },
                { class: 'strength-fair', text: 'Fair password' },
                { class: 'strength-good', text: 'Good password' },
                { class: 'strength-strong', text: 'Strong password' }
            ];
            
            if (score === 0) {
                return { score: 0, class: '', text: 'Enter a password' };
            }
            
            const level = Math.min(score - 1, 3);
            return {
                score: score,
                class: strengthLevels[level].class,
                text: strengthLevels[level].text
            };
        }
        
        // Form validation
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password1 = document.getElementById('id_new_password1').value;
            const password2 = document.getElementById('id_new_password2').value;
            
            if (password1 !== password2) {
                alert('Passwords do not match!');
                return;
            }
            
            if (password1.length < 8) {
                alert('Password must be at least 8 characters long!');
                return;
            }
            
            // Show loading state
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Resetting...';
            submitBtn.disabled = true;
            
            // Simulate form submission
            setTimeout(() => {
                alert('Password reset successfully!\n\nYou can now log in with your new password.');
                window.location.href = '#';
            }, 2000);
        });
        
        // Form field animations
        document.querySelectorAll('input').forEach(field => {
            field.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            field.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
