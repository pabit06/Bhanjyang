{% load static %}
<!-- Premium Loading Overlay -->
<div id="loading-overlay" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white transition-all duration-700 ease-in-out">
    <!-- Background Decor -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none">
        <div class="absolute inset-0 bg-repeat bg-center" style="background-image: url('{% static 'images/backgrounds/pattern-light.png' %}'); background-size: 400px;"></div>
    </div>
    
    <div class="relative z-10 text-center animate-fade-in">
        <!-- Pulse Logo -->
        <div class="relative mb-8">
            <div class="absolute inset-0 bg-deuraligreen/20 rounded-full blur-2xl animate-pulse scale-150"></div>
            <img src="{% static 'images/logos/Logo.png' %}" alt="Bhanjyang Cooperative" class="w-24 h-24 mx-auto relative z-10 hover:scale-110 transition-transform duration-500" loading="eager">
        </div>
        
        <!-- Loading Text with Character Animation -->
        <div class="space-y-4">
            <h3 class="text-2xl font-bold text-gray-800 font-montserrat tracking-tight overflow-hidden">
                <span class="inline-block animate-slide-in-up">BHANJYANG</span>
            </h3>
            <div class="flex items-center justify-center space-x-2">
                <div class="w-1.5 h-1.5 bg-deuraligreen rounded-full animate-bounce"></div>
                <div class="w-1.5 h-1.5 bg-deuraligreen rounded-full animate-bounce [animation-delay:0.2s]"></div>
                <div class="w-1.5 h-1.5 bg-deuraligreen rounded-full animate-bounce [animation-delay:0.4s]"></div>
            </div>
        </div>
        
        <!-- Subtle Progress Line -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-48 h-0.5 bg-gray-100 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-gradient-to-r from-deuraligreen to-bhanjyangred transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
    </div>
</div>

<style>
    #loading-overlay.hidden-overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-20px);
    }
    
    .animate-slide-in-up {
        animation: slideInUpLoading 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes slideInUpLoading {
        0% { transform: translateY(100%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }
    
    .shadow-glow {
        box-shadow: 0 0 20px rgba(39, 174, 96, 0.3);
    }
</style>

<script>
    (function() {
        const overlay = document.getElementById('loading-overlay');
        const bar = document.getElementById('loading-bar');
        if (!overlay) return;
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 30;
            if (progress > 90) progress = 90;
            if (bar) bar.style.width = progress + '%';
        }, 200);
        
        window.addEventListener('load', () => {
            clearInterval(interval);
            if (bar) bar.style.width = '100%';
            
            setTimeout(() => {
                overlay.classList.add('hidden-overlay');
                // Allow scrolling again
                document.body.style.overflow = '';
                
                // Completely remove from DOM after transition to be safe
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 800);
            }, 400); // Reduced delay for snappier feel
        });
        
        // Safety timeout - hide anyway after 2.5 seconds to prevent being "stuck"
        setTimeout(() => {
            if (!overlay.classList.contains('hidden-overlay')) {
                overlay.classList.add('hidden-overlay');
                document.body.style.overflow = '';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 800);
            }
        }, 2500);
        
        // Prevent scroll while loading
        document.body.style.overflow = 'hidden';
    })();
</script>
