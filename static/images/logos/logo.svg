<!-- static/images/logo.svg -->
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5530;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7c59;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Cooperative Symbol -->
  <path d="M20 20 L40 20 L40 40 L20 40 Z" fill="white" opacity="0.9"/>
  <path d="M25 25 L35 25 L35 35 L25 35 Z" fill="url(#logoGradient)"/>
  <circle cx="30" cy="30" r="3" fill="white"/>
  
  <!-- Text -->
  <text x="65" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c5530">Bhanjyang</text>
  <text x="65" y="40" font-family="Arial, sans-serif" font-size="12" fill="#4a7c59">Cooperative</text>
  <text x="65" y="52" font-family="Arial, sans-serif" font-size="8" fill="#8b4513">Saving & Credit Society</text>
</svg>
