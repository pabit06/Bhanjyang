<!-- Button Component -->
{% load static %}

{% comment %}
Usage:
{% include 'components/button.html' with type="primary" size="md" text="Click me" icon="plus" %}
{% endcomment %}

<button type="{% if button_type %}{{ button_type }}{% else %}button{% endif %}" 
        class="inline-flex items-center justify-center font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed
               {% if type == 'primary' %}bg-primary-600 text-white hover:bg-primary-700 focus:ring-primary-500{% endif %}
               {% if type == 'secondary' %}bg-gray-200 text-gray-900 hover:bg-gray-300 focus:ring-gray-500{% endif %}
               {% if type == 'success' %}bg-success-600 text-white hover:bg-success-700 focus:ring-success-500{% endif %}
               {% if type == 'warning' %}bg-warning-600 text-white hover:bg-warning-700 focus:ring-warning-500{% endif %}
               {% if type == 'danger' %}bg-danger-600 text-white hover:bg-danger-700 focus:ring-danger-500{% endif %}
               {% if type == 'outline' %}border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 focus:ring-primary-500{% endif %}
               {% if type == 'ghost' %}text-gray-700 hover:bg-gray-100 focus:ring-gray-500{% endif %}
               {% if size == 'xs' %}px-2.5 py-1.5 text-xs{% endif %}
               {% if size == 'sm' %}px-3 py-2 text-sm{% endif %}
               {% if size == 'md' %}px-4 py-2 text-sm{% endif %}
               {% if size == 'lg' %}px-6 py-3 text-base{% endif %}
               {% if size == 'xl' %}px-8 py-4 text-lg{% endif %}
               {% if full_width %}w-full{% endif %}
               {% if class %}{{ class }}{% endif %}"
        {% if onclick %}onclick="{{ onclick }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        {% if id %}id="{{ id }}"{% endif %}
        {% if data_attributes %}{{ data_attributes }}{% endif %}>
        
    {% if icon and icon_position != 'right' %}
    <svg class="{% if size == 'xs' %}w-3 h-3{% elif size == 'sm' %}w-4 h-4{% elif size == 'lg' %}w-5 h-5{% elif size == 'xl' %}w-6 h-6{% else %}w-4 h-4{% endif %} {% if text %}mr-2{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        {% if icon == 'plus' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        {% elif icon == 'edit' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        {% elif icon == 'delete' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        {% elif icon == 'save' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
        {% elif icon == 'download' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        {% elif icon == 'upload' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        {% elif icon == 'search' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        {% elif icon == 'filter' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
        {% elif icon == 'refresh' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        {% elif icon == 'eye' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        {% elif icon == 'eye-off' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
        {% elif icon == 'check' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        {% elif icon == 'x' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        {% elif icon == 'chevron-left' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        {% elif icon == 'chevron-right' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        {% elif icon == 'chevron-down' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        {% elif icon == 'chevron-up' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
        {% elif icon == 'menu' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        {% elif icon == 'close' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        {% elif icon == 'loading' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        {% endif %}
    </svg>
    {% endif %}
    
    {% if text %}{{ text }}{% endif %}
    
    {% if icon and icon_position == 'right' %}
    <svg class="{% if size == 'xs' %}w-3 h-3{% elif size == 'sm' %}w-4 h-4{% elif size == 'lg' %}w-5 h-5{% elif size == 'xl' %}w-6 h-6{% else %}w-4 h-4{% endif %} {% if text %}ml-2{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        {% if icon == 'chevron-right' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        {% elif icon == 'external-link' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
        {% endif %}
    </svg>
    {% endif %}
    
    {% if loading %}
    <svg class="animate-spin {% if size == 'xs' %}w-3 h-3{% elif size == 'sm' %}w-4 h-4{% elif size == 'lg' %}w-5 h-5{% elif size == 'xl' %}w-6 h-6{% else %}w-4 h-4{% endif %} {% if text %}ml-2{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
    </svg>
    {% endif %}
</button>
